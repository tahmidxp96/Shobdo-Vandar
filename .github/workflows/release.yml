name: Build and Release Kindle Dictionaries
run-name: Build & Release version ${{ github.ref_name }} by @${{ github.actor }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish MOBI Dictionaries (macOS)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime (v3.10)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download Kindle Previewer macOS Installer
        run: |
          echo "Downloading official Amazon Kindle Previewer 3 macOS installer..."
          curl -L "https://d2bzeorukaqrvt.cloudfront.net/KindlePreviewerInstaller.pkg" -o KindlePreviewerInstaller.pkg

      - name: Install Kindle Previewer and Verify compiler
        run: |
          echo "Executing silent macOS installer..."
          sudo installer -pkg KindlePreviewerInstaller.pkg -target /
          
          # Verify detection path for embedded kindlegen
          KP_PATH="/Applications/Kindle Previewer 3.app/Contents/lib/fc/bin/kindlegen"
          if [ -f "$KP_PATH" ]; then
            echo "SUCCESS: Kindle Previewer compiler found at: $KP_PATH"
          else
            echo "FATAL: Kindle Previewer was not installed correctly!"
            exit 1
          fi

      - name: Ingest Lexicon & Compile MOBI Dictionaries
        run: |
          echo "Initializing dictionary builder pipeline..."
          # Running without -c triggers raw data ingestion, normalization, and full MOBI compilation
          python3 kindle_dictionary_builder.py

      - name: Extract Latest Changelog Notes
        run: |
          echo "Extracting latest changelog block for GitHub Release description..."
          python3 version_manager.py notes > latest_notes.md
          cat latest_notes.md

      - name: Publish Compiled MOBI Dictionaries to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/en-bn/*.mobi
            build/bn-en/*.mobi
            build/bn-bn/*.mobi
          draft: false
          prerelease: false
          body_path: latest_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

